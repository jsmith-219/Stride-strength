/* Coach attendance page */
.attendance-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.attendance-toolbar>div:last-child{display:flex;gap:8px}.attendance-toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;font-weight:700;font-size:11px;cursor:pointer}.attendance-toolbar h2{font:600 25px Oswald;margin:4px 0 0}.attendance-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:13px}.attendance-grid{min-width:850px}.attendance-grid-head,.attendance-grid-row{display:grid;grid-template-columns:minmax(210px,1.6fr) repeat(7,minmax(82px,1fr));align-items:stretch}.attendance-grid-head{background:#171713;color:#fff}.attendance-grid-head>div{padding:13px 10px;border-right:1px solid #38332f;display:grid;place-items:center;gap:2px;font-size:9px;letter-spacing:.1em}.attendance-grid-head>div:first-child{place-items:center start;padding-left:20px}.attendance-grid-head span{color:#f26522;font:600 18px Oswald;letter-spacing:0}.attendance-grid-row{border-bottom:1px solid var(--line)}.attendance-grid-row:last-child{border-bottom:0}.attendance-athlete{display:flex;align-items:center;gap:11px;padding:12px 16px;border-right:1px solid var(--line);min-width:0}.attendance-athlete>div{display:grid;min-width:0}.attendance-athlete strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attendance-athlete small{font-size:9px;color:var(--muted);margin-top:3px}.attendance-cell{display:grid;place-items:center;align-content:center;gap:3px;min-height:66px;border-right:1px solid var(--line);text-align:center}.attendance-cell:last-child{border-right:0}.attendance-cell span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-weight:900}.attendance-cell small{font-size:8px;font-weight:700}.attendance-cell.present{background:#eff8f1;color:#267447}.attendance-cell.present span{background:#318b54;color:white}.attendance-cell.missing{background:#fff4f1;color:#9b3525}.attendance-cell.missing span{background:#dfd2cc;color:#8b3321}.attendance-cell.off{background:#f3f1ef;color:#98928e}.attendance-cell.off span{background:#e2dedb;color:#777}.attendance-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:13px;color:var(--muted);font-size:10px}.attendance-legend span{display:flex;align-items:center;gap:6px}.attendance-legend b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:white}.legend-present{background:#318b54}.legend-missing{background:#8b3321}.legend-off{background:#999}.attendance-empty{background:#fff;border:1px solid var(--line);border-radius:13px;padding:45px;text-align:center}.attendance-empty h2{font:600 26px Oswald}.attendance-empty p{color:var(--muted)}
@media(max-width:650px){.mobile-nav.coach-mobile-nav{grid-template-columns:repeat(6,minmax(0,1fr));padding-left:4px;padding-right:4px;gap:1px}.mobile-nav.coach-mobile-nav button{font-size:7px;padding-left:1px;padding-right:1px}.attendance-toolbar{align-items:center}.attendance-toolbar>button{display:none}.attendance-toolbar>div:last-child button:first-child{display:none}.attendance-toolbar h2{font-size:19px}.attendance-scroll{margin-left:-16px;margin-right:-16px;border-radius:0}.attendance-grid{min-width:780px}.attendance-grid-head,.attendance-grid-row{grid-template-columns:180px repeat(7,85px)}.attendance-grid-head>div:first-child,.attendance-athlete{position:sticky;left:0;z-index:2}.attendance-grid-head>div:first-child{background:#171713}.attendance-athlete{background:#fff}.attendance-grid-row:nth-child(even) .attendance-athlete{background:#faf8f6}}
.attendance-cell.upcoming{background:#fff9f4;color:#b85a27}.attendance-cell.upcoming span{background:#f5dacb;color:#b85a27}.legend-upcoming{background:#d9783d}

/* Detailed athlete attendance history */
.attendance-history-nav{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:12px;margin-bottom:15px}.attendance-history-nav>div{text-align:center}.attendance-history-nav h3{font:600 22px Oswald;margin:4px 0}.attendance-history-nav button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px;font-size:10px;font-weight:700;cursor:pointer}.attendance-day{appearance:none;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.attendance-day.selected{border-color:#f26522;box-shadow:inset 0 0 0 2px #f26522;background:#fff7f2}.attendance-detail-card{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.attendance-detail-top{display:grid;grid-template-columns:1fr 110px;gap:16px;align-items:end;padding:16px 18px;background:#f7f3ef;border-bottom:1px solid var(--line)}.attendance-detail-top label,.attendance-detail-top>div{display:grid;gap:6px}.attendance-detail-top span,.attendance-time-grid span{font-size:8px;letter-spacing:.12em;color:var(--muted);font-weight:800}.attendance-detail-top select{height:39px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px}.attendance-detail-top>div{text-align:right}.attendance-detail-top strong{font:600 25px Oswald;color:#f26522}.attendance-time-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.attendance-time-grid>div{padding:17px 18px;display:grid;gap:5px;border-right:1px solid var(--line)}.attendance-time-grid>div:last-child{border-right:0}.attendance-time-grid strong{font:600 19px Oswald}.attendance-exercise-list{padding:17px 18px}.attendance-exercise-list>.eyebrow{margin-bottom:10px}.attendance-exercise{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.attendance-exercise:last-child{border-bottom:0}.attendance-exercise>span{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#e8e3df;color:#888;font-size:11px}.attendance-exercise.finished>span{background:#318b54;color:#fff}.attendance-exercise strong{font-size:11px}.attendance-exercise small{font-size:9px;color:var(--muted)}.attendance-no-workout{padding:13px;background:#f5f2ef;border-radius:7px;color:var(--muted);font-size:11px}
@media(max-width:650px){.attendance-history-nav{grid-template-columns:1fr 1fr}.attendance-history-nav>div{grid-column:1/3;grid-row:1}.attendance-history-nav>button{grid-row:2}.attendance-time-grid{grid-template-columns:1fr}.attendance-time-grid>div{border-right:0;border-bottom:1px solid var(--line)}.attendance-time-grid>div:last-child{border-bottom:0}.attendance-detail-top{grid-template-columns:1fr 75px}.attendance-week{margin-left:-4px;margin-right:-4px}.attendance-exercise{grid-template-columns:24px 1fr}.attendance-exercise small{grid-column:2}}

/* Editable team attendance statuses */

.practice-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.practice-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;font-size:11px;font-weight:800;cursor:pointer}.practice-tabs button.active{background:#f26522;border-color:#f26522;color:#fff}.practice-toolbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.practice-toolbar h2{font:600 28px Oswald;margin:3px 0 0}.practice-toolbar>div:last-child{display:flex;gap:8px;align-items:center}.practice-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.practice-stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px}.practice-stat span{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:800}.practice-stat strong{font:600 28px Oswald;display:block;margin-top:5px}.practice-stat.present{border-top:4px solid #318b54}.practice-stat.late{border-top:4px solid #e6a52e}.practice-stat.excused{border-top:4px solid #4383c4}.practice-stat.missing{border-top:4px solid #c7c7c0}.practice-list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.practice-row{display:grid;grid-template-columns:minmax(180px,1.4fr) 100px 130px 120px 130px;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid #ecece6}.practice-row:last-child{border-bottom:0}.practice-row.head{background:#191b17;color:#fff;font-size:9px;letter-spacing:.11em;font-weight:800}.practice-person{display:flex;align-items:center;gap:10px}.practice-person>div{display:grid}.practice-person small{font-size:9px;color:var(--muted)}.practice-row select,.practice-row input,.practice-form input,.practice-date{border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px;min-width:0;width:100%}.practice-status{font-size:10px;font-weight:800;text-transform:uppercase}.practice-status.present{color:#247342}.practice-status.late{color:#a36a00}.practice-status.excused{color:#2e6da8}.practice-status.absent{color:#a33939}.practice-status.none{color:#8a8e84}.practice-empty{background:#fff;border:1px dashed #c9cbc2;border-radius:12px;padding:45px;text-align:center}.practice-empty h2{font:600 25px Oswald;margin:0 0 8px}.practice-empty p{color:var(--muted);margin:0 0 18px}.practice-form{display:grid;grid-template-columns:1.4fr .6fr 1fr auto;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:15px}.practice-form button{white-space:nowrap}.practice-roster-actions{display:flex;gap:6px}.practice-roster-actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px;font-size:10px;font-weight:700;cursor:pointer}.practice-roster-actions .archive-button{color:#a33939}.kiosk-shell{min-height:65vh;border-radius:18px;background:#11130f;color:#fff;display:grid;place-items:center;text-align:center;padding:35px;position:relative;overflow:hidden}.kiosk-shell:before{content:'';position:absolute;width:520px;height:520px;border:1px solid #30332b;border-radius:50%}.kiosk-content{position:relative;z-index:1;max-width:650px;width:100%}.kiosk-content .brand-mark{margin:0 auto 22px}.kiosk-content h2{font:600 47px Oswald;margin:8px 0}.kiosk-content p{color:#adb1a6}.scan-form{display:flex;max-width:480px;margin:25px auto 0}.scan-form input{flex:1;border:0;border-radius:10px 0 0 10px;padding:16px;font-size:17px;text-align:center;text-transform:uppercase}.scan-form button{border:0;border-radius:0 10px 10px 0;background:#f26522;color:#fff;padding:0 20px;font-weight:800}.scan-hint{display:block;margin-top:12px;color:#7f8578;font-size:10px}.kiosk-result{border-radius:16px;padding:32px;margin:24px auto 0;max-width:500px}.kiosk-result.success{background:#1f7b45}.kiosk-result.duplicate{background:#a06b11}.kiosk-result.error{background:#a33c38}.kiosk-result strong{display:block;font:600 34px Oswald}.kiosk-result span{display:block;margin-top:7px}.kiosk-exit{position:absolute;right:18px     if(action==='mark-unrecorded-absent'&&confirm('Mark every athlete without a status as absent today?')){
      const records={...practiceRecords(today)};practiceActive().forEach(a=>{if(!records[a.id]?.status)records[a.id]={status:'absent',checkedInAt:null,recordedBy:state.user.uid,recordedByName:state.user.displayName||state.user.email}});await setDoc(doc(db,'practiceAttendance',today),{date:today,records,updatedAt:serverTimestamp()},{merge:true});
    }

    if(action==='save-template'){const w=state.workouts[state.selectedDate],name=prompt('Name this reusable workout:',w.title);if(name?.trim())await setDoc(doc(db,'templates',String(Date.now())),{title:name.trim(),focus:w.focus||'',note:w.note||'',tipTitle:w.tipTitle||'',tipText:w.tipText||'',exercises:w.exercises||[],createdAt:serverTimestamp(),sourceDate:state.selectedDate})}

      await setDoc(doc(db,'progress',state.user.uid),{completed:state.completed,attendance:state.attendance,updatedAt:serverTimestamp()},{merge:true});
    }
    if(action==='edit'){const w=state.workouts[state.selectedDate];if(state.editing)await setDoc(doc(db,'workouts',state.selectedDate),w);state.editing=!state.editing}
    if(action==='add')state.workouts[state.selectedDate].exercises.push({id:Date.now(),name:'New Exercise',lift:null,sets:3,reps:8,percent:null,rest:'90 sec'});
    if(action==='toggle-set-plan'){const ex=state.workouts[state.selectedDate].exercises.find(x=>x.id===Number(el.dataset.id));if(Array.isArray(ex.setPlan)){ex.sets=ex.setPlan.length;ex.reps=ex.setPlan[0]?.reps??ex.reps;ex.percent=ex.setPlan[0]?.percent??ex.percent;delete ex.setPlan}else ex.setPlan=Array.from({length:Math.max(1,Number(ex.sets)||1)},()=>({reps:ex.reps,percent:ex.percent??''}))}
    if(action==='add-set'){const ex=state.workouts[state.selectedDate].exercises.find(x=>x.id===Number(el.dataset.id)),last=ex.setPlan.at(-1)||{reps:ex.reps,percent:ex.percent??''};ex.setPlan.push({...last})}
    if(action==='remove-set'){const ex=state.workouts[state.selectedDate].exercises.find(x=>x.id===Number(el.dataset.id));if(ex.setPlan.length>1)ex.setPlan.splice(Number(el.dataset.index),1)}
    render();
  }catch(err){state.error=err.code==='auth/popup-blocked'?'Allow the Google sign-in popup and try again.':err.message;render()}
});
document.addEventListener('change',async e=>{const action=e.target.dataset.action;if(!action)return;if(action==='practice-status'){await savePracticeStatus(e.target.dataset.id,e.target.value,e.target.dataset.date);return}if(action==='practice-date'){state.practiceDate=e.target.value;render();return}if(action==='practice-search'){state.practiceSearch=e.target.value;render();return}if(action==='template-date'){state.selectedDate=e.target.value;render();return}if(action==='attendance-grid-status'){const id=e.target.dataset.athlete,key=e.target.dataset.date,value=e.target.value;state.allProgress[id]??={};state.allProgress[id].attendance??={};const old=state.allProgress[id].attendance[key]||{};if(value==='present')state.allProgress[id].attendance[key]={...old,status:old.status==='completed'?'completed':'in_progress',checkedInAt:old.checkedInAt||new Date().toISOString(),completedAt:old.status==='completed'?old.completedAt||null:null};else if(value)state.allProgress[id].attendance[key]={status:value,checkedInAt:null,completedAt:null};else delete state.allProgress[id].attendance[key];await setDoc(doc(db,'progress',id),{attendance:state.allProgress[id].attendance,updatedAt:serverTimestamp()},{merge:true});render();return}const a=athlete();if(action==='attendance-status'){state.allProgress[a.id]??={};state.allProgress[a.id].attendance??={};const key=state.attendanceDetailDate||today,old=state.allProgress[a.id].attendance[key]||{};if(e.target.value){const active=e.target.value==='in_progress'||e.target.value==='completed';state.allProgress[a.id].attendance[key]={...old,status:e.target.value,checkedInAt:old.checkedInAt||(active?new Date().toISOString():null),completedAt:e.target.value==='completed'?(old.completedAt||new Date().toISOString()):null}}else delete state.allProgress[a.id].attendance[key]}if(action==='profile-name'){a.name=e.target.value;a.initials=initials(a.name)}if(action==='profile-event')a.event=e.target.value;if(action.startsWith('profile-max-'))a.maxes[action.slice(12)]=Number(e.target.value);if(state.preview&&action.startsWith('max-')){render();return}if(action.startsWith('max-')){const lift=action.slice(4);a.maxes[lift]=Number(e.target.value);await updateDoc(doc(db,'athletes',state.user.uid),{[`maxes.${lift}`]:a.maxes[lift]})}const w=state.workouts[state.selectedDate];if(action==='workout-title')w.title=e.target.value;if(action==='workout-focus')w.focus=e.target.value;if(action==='workout-note')w.note=e.target.value;if(action==='workout-tip-title')w.tipTitle=e.target.value;if(action==='workout-tip-text')w.tipText=e.target.value;const setMatch=action.match(/^set-(reps|percent)-(\d+)-(\d+)$/);if(setMatch){const ex=w.exercises.find(x=>x.id===Number(setMatch[2])),set=ex.setPlan[Number(setMatch[3])];set[setMatch[1]]=setMatch[1]==='percent'?(e.target.value===''?'':Number(e.target.value)):e.target.value}const match=action.match(/^ex-(name|sets|reps|percent|lift|rest)-(\d+)$/);if(match){const ex=w.exercises.find(x=>x.id===Number(match[2])),field=match[1];if(field==='lift'){ex.lift=e.target.value||null;if(ex.lift&&ex.percent==null)ex.percent=70}else if(field==='percent')ex.percent=e.target.value===''?null:Number(e.target.value);else ex[field]=field==='sets'?Number(e.target.value):e.target.value}render()});
