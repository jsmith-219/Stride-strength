.ui-icon{display:inline-grid;place-items:center;font-weight:800;line-height:1;min-width:20px}.ui-icon svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.login-page{min-height:100vh;display:grid;grid-template-columns:minmax(400px,1fr) 1fr;background:#f3f3ef}.login-card{padding:7vw;display:flex;flex-direction:column;justify-content:center;max-width:650px}.login-brand{color:var(--ink);padding-left:0}.login-card h1{font:700 clamp(44px,6vw,78px) Oswald;margin:18px 0;line-height:.98}.login-copy{color:var(--muted);max-width:420px;line-height:1.6}.google-button{margin-top:22px;background:var(--ink);color:white;border:0;border-radius:9px;padding:15px 20px;font-weight:700;cursor:pointer;max-width:330px}.google-g{background:white;color:#4285f4;border-radius:50%;padding:4px 7px;margin-right:10px}.login-card>small{color:var(--muted);margin-top:15px}.auth-error{max-width:420px;background:#fee8e5;color:#8b231b;padding:12px;border-radius:7px;margin-top:13px;font-size:13px}.login-art{background:var(--ink);color:white;margin:24px;border-radius:20px;padding:60px;display:flex;flex-direction:column;justify-content:space-between}.art-number{font:700 120px Oswald;color:#30342b}.login-art span{color:var(--lime);font-size:11px;letter-spacing:.2em}.login-art strong{display:block;font:700 58px Oswald;line-height:1;margin-top:12px}.loading-page{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:14px}.account-label{font-size:9px;color:#797e72;letter-spacing:.14em}.account-email{font-size:10px;color:#b8bcb1;overflow:hidden;text-overflow:ellipsis;margin:7px 0 10px}.empty-roster,.empty-state{background:white;border:1px solid var(--line);padding:20px;border-radius:9px;color:var(--muted);font-size:12px}
@media(max-width:700px){.login-page{display:block}.login-card{min-height:100vh;padding:35px 24px}.login-art{display:none}}

/* Coach attendance page */
.attendance-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.attendance-toolbar>div:last-child{display:flex;gap:8px}.attendance-toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;font-weight:700;font-size:11px;cursor:pointer}.attendance-toolbar h2{font:600 25px Oswald;margin:4px 0 0}.attendance-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:13px}.attendance-grid{min-width:690px}.attendance-grid-head,.attendance-grid-row{display:grid;grid-template-columns:minmax(210px,1.6fr) repeat(5,minmax(82px,1fr));align-items:stretch}.attendance-grid-head{background:#171713;color:#fff}.attendance-grid-head>div{padding:13px 10px;border-right:1px solid #38332f;display:grid;place-items:center;gap:2px;font-size:9px;letter-spacing:.1em}.attendance-grid-head>div:first-child{place-items:center start;padding-left:20px}.attendance-grid-head span{color:#f26522;font:600 18px Oswald;letter-spacing:0}.attendance-grid-row{border-bottom:1px solid var(--line)}.attendance-grid-row:last-child{border-bottom:0}.attendance-athlete{display:flex;align-items:center;gap:11px;padding:12px 16px;border-right:1px solid var(--line);min-width:0}.attendance-athlete>div{display:grid;min-width:0}.attendance-athlete strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attendance-athlete small{font-size:9px;color:var(--muted);margin-top:3px}.attendance-cell{display:grid;place-items:center;align-content:center;gap:3px;min-height:66px;border-right:1px solid var(--line);text-align:center}.attendance-cell:last-child{border-right:0}.attendance-cell span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-weight:900}.attendance-cell small{font-size:8px;font-weight:700}.attendance-cell.present{background:#eff8f1;color:#267447}.attendance-cell.present span{background:#318b54;color:white}.attendance-cell.missing{background:#fff4f1;color:#9b3525}.attendance-cell.missing span{background:#dfd2cc;color:#8b3321}.attendance-cell.off{background:#f3f1ef;color:#98928e}.attendance-cell.off span{background:#e2dedb;color:#777}.attendance-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:13px;color:var(--muted);font-size:10px}.attendance-legend span{display:flex;align-items:center;gap:6px}.attendance-legend b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:white}.legend-present{background:#318b54}.legend-missing{background:#8b3321}.legend-off{background:#999}.attendance-empty{background:#fff;border:1px solid var(--line);border-radius:13px;padding:45px;text-align:center}.attendance-empty h2{font:600 26px Oswald}.attendance-empty p{color:var(--muted)}
@media(max-width:650px){.mobile-nav.coach-mobile-nav{grid-template-columns:repeat(6,minmax(0,1fr));padding-left:4px;padding-right:4px;gap:1px}.mobile-nav.coach-mobile-nav button{font-size:7px;padding-left:1px;padding-right:1px}.attendance-toolbar{align-items:center}.attendance-toolbar>button{display:none}.attendance-toolbar>div:last-child button:first-child{display:none}.attendance-toolbar h2{font-size:19px}.attendance-scroll{margin-left:-16px;margin-right:-16px;border-radius:0}.attendance-grid{min-width:605px}.attendance-grid-head,.attendance-grid-row{grid-template-columns:180px repeat(5,85px)}.attendance-grid-head>div:first-child,.attendance-athlete{position:sticky;left:0;z-index:2}.attendance-grid-head>div:first-child{background:#171713}.attendance-athlete{background:#fff}.attendance-grid-row:nth-child(even) .attendance-athlete{background:#faf8f6}}
.attendance-cell.upcoming{background:#fff9f4;color:#b85a27}.attendance-cell.upcoming span{background:#f5dacb;color:#b85a27}.legend-upcoming{background:#d9783d}

/* Detailed athlete attendance history */
.attendance-history-nav{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:12px;margin-bottom:15px}.attendance-history-nav>div{text-align:center}.attendance-history-nav h3{font:600 22px Oswald;margin:4px 0}.attendance-history-nav button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px;font-size:10px;font-weight:700;cursor:pointer}.attendance-day{appearance:none;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.attendance-day.selected{border-color:#f26522;box-shadow:inset 0 0 0 2px #f26522;background:#fff7f2}.attendance-detail-card{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.attendance-detail-top{display:grid;grid-template-columns:1fr 110px;gap:16px;align-items:end;padding:16px 18px;background:#f7f3ef;border-bottom:1px solid var(--line)}.attendance-detail-top label,.attendance-detail-top>div{display:grid;gap:6px}.attendance-detail-top span,.attendance-time-grid span{font-size:8px;letter-spacing:.12em;color:var(--muted);font-weight:800}.attendance-detail-top select{height:39px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px}.attendance-detail-top>div{text-align:right}.attendance-detail-top strong{font:600 25px Oswald;color:#f26522}.attendance-time-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.attendance-time-grid>div{padding:17px 18px;display:grid;gap:5px;border-right:1px solid var(--line)}.attendance-time-grid>div:last-child{border-right:0}.attendance-time-grid strong{font:600 19px Oswald}.attendance-exercise-list{padding:17px 18px}.attendance-exercise-list>.eyebrow{margin-bottom:10px}.attendance-exercise{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.attendance-exercise:last-child{border-bottom:0}.attendance-exercise>span{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#e8e3df;color:#888;font-size:11px}.attendance-exercise.finished>span{background:#318b54;color:#fff}.attendance-exercise strong{font-size:11px}.attendance-exercise small{font-size:9px;color:var(--muted)}.attendance-no-workout{padding:13px;background:#f5f2ef;border-radius:7px;color:var(--muted);font-size:11px}
@media(max-width:650px){.attendance-history-nav{grid-template-columns:1fr 1fr}.attendance-history-nav>div{grid-column:1/3;grid-row:1}.attendance-history-nav>button{grid-row:2}.attendance-time-grid{grid-template-columns:1fr}.attendance-time-grid>div{border-right:0;border-bottom:1px solid var(--line)}.attendance-time-grid>div:last-child{border-bottom:0}.attendance-detail-top{grid-template-columns:1fr 75px}.attendance-week{margin-left:-4px;margin-right:-4px}.attendance-exercise{grid-template-columns:24px 1fr}.attendance-exercise small{grid-column:2}}

/* Editable team attendance statuses */

.practice-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.practice-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;font-size:11px;font-weight:800;cursor:pointer}.practice-tabs button.active{background:#f26522;border-color:#f26522;color:#fff}.practice-toolbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.practice-toolbar h2{font:600 28px Oswald;margin:3px 0 0}.practice-toolbar>div:last-child{display:flex;gap:8px;align-items:center}.practice-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.practice-stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px}.practice-stat span{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:800}.practice-stat strong{font:600 28px Oswald;display:block;margin-top:5px}.practice-stat.present{border-top:4px solid #318b54}.practice-stat.late{border-top:4px solid #e6a52e}.practice-stat.excused{border-top:4px solid #4383c4}.practice-stat.missing{border-top:4px solid #c7c7c0}.practice-list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.practice-row{display:grid;grid-template-columns:minmax(180px,1.4fr) 100px 130px 120px 130px;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid #ecece6}.practice-row:last-child{border-bottom:0}.practice-row.head{background:#191b17;color:#fff;font-size:9px;letter-spacing:.11em;font-weight:800}.practice-person{display:flex;align-items:center;gap:10px}.practice-person>div{display:grid}.practice-person small{font-size:9px;color:var(--muted)}.practice-row select,.practice-row input,.practice-form input,.practice-date{border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px;min-width:0;width:100%}.practice-status{font-size:10px;font-weight:800;text-transform:uppercase}.practice-status.present{color:#247342}.practice-status.late{color:#a36a00}.practice-status.excused{color:#2e6da8}.practice-status.absent{color:#a33939}.practice-status.none{color:#8a8e84}.practice-empty{background:#fff;border:1px dashed #c9cbc2;border-radius:12px;padding:45px;text-align:center}.practice-empty h2{font:600 25px Oswald;margin:0 0 8px}.practice-empty p{color:var(--muted);margin:0 0 18px}.practice-form{display:grid;grid-template-columns:1.4fr .6fr 1fr auto;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:15px}.practice-form button{white-space:nowrap}.practice-roster-actions{display:flex;gap:6px}.practice-roster-actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px;font-size:10px;font-weight:700;cursor:pointer}.practice-roster-actions .archive-button{color:#a33939}.kiosk-shell{min-height:65vh;border-radius:18px;background:#11130f;color:#fff;display:grid;place-items:center;text-align:center;padding:35px;position:relative;overflow:hidden}.kiosk-shell:before{content:'';position:absolute;width:520px;height:520px;border:1px solid #30332b;border-radius:50%}.kiosk-content{position:relative;z-index:1;max-width:650px;width:100%}.kiosk-content .brand-mark{margin:0 auto 22px}.kiosk-content h2{font:600 47px Oswald;margin:8px 0}.kiosk-content p{color:#adb1a6}.scan-form{display:flex;max-width:480px;margin:25px auto 0}.scan-form input{flex:1;border:0;border-radius:10px 0 0 10px;padding:16px;font-size:17px;text-align:center;text-transform:uppercase}.scan-form button{border:0;border-radius:0 10px 10px 0;background:#f26522;color:#fff;padding:0 20px;font-weight:800}.scan-hint{display:block;margin-top:12px;color:#7f8578;font-size:10px}.kiosk-result{border-radius:16px;padding:32px;margin:24px auto 0;max-width:500px}.kiosk-result.success{background:#1f7b45}.kiosk-result.duplicate{background:#a06b11}.kiosk-result.error{background:#a33c38}.kiosk-result strong{display:block;font:600 34px Oswald}.kiosk-result span{display:block;margin-top:7px}.kiosk-exit{position:absolute;right:18px function editExercise(ex,i){const options=[['','No max — bodyweight or fixed load'],['squat','Squat max'],['bench','Bench max'],['deadlift','Deadlift max']].map(([v,label])=>`<option value="${v}" ${ex.lift===v||(!ex.lift&&!v)?'selected':''}>${label}</option>`).join(''),varied=Array.isArray(ex.setPlan);const plan=varied?`<div class="set-plan-editor"><div class="set-plan-title"><div><strong>Set-by-set plan</strong><small>Enter the reps and percentage for each set.</small></div><button type="button" data-action="toggle-set-plan" data-id="${ex.id}">Use same percentage</button></div><div class="set-plan-edit-head"><span>SET</span><span>REPS</span><span>PERCENTAGE</span><span></span></div>${ex.setPlan.map((set,n)=>`<div class="set-plan-edit-row"><b>${n+1}</b>${input(set.reps,`set-reps-${ex.id}-${n}`)}<div>${input(set.percent??'',`set-percent-${ex.id}-${n}`,'number')}<span>%</span></div><button type="button" data-action="remove-set" data-id="${ex.id}" data-index="${n}" aria-label="Remove set ${n+1}">×</button></div>`).join('')}<button type="button" class="add-set-button" data-action="add-set" data-id="${ex.id}">${icon('plus')} Add set</button></div>`:`<button type="button" class="varied-set-button" data-action="toggle-set-plan" data-id="${ex.id}">${icon('plus')} Use different reps or percentages for each set</button>`;return `<div class="exercise-editor ${varied?'uses-set-plan':''}"><div class="edit-number">${String(i+1).padStart(2,'0')}</div><label class="edit-name"><span>EXERCISE NAME</span>${input(ex.name,`ex-name-${ex.id}`)}</label><label class="edit-basis"><span>BASED ON</span><select data-action="ex-lift-${ex.id}">${options}</select></label>${varied?'':`<label><span>SETS</span>${input(ex.sets,`ex-sets-${ex.id}`,'number')}</label><label><span>REPS</span>${input(ex.reps,`ex-reps-${ex.id}`)}</label><label class="edit-percent"><span>TRAINING PERCENTAGE</span><div>${input(ex.percent??'',`ex-percent-${ex.id}`,'number')}<b>%</b></div><small>${ex.lift?'Athlete weight is calc function performanceAthleteRelayTeamRows(){
  const rows=[];
  performanceSeasonMeets().forEach(meet=>{
    const roster=meet.roster||{};
    (meet.relayResults||[]).forEach(result=>{
      const event=result.event||'Relay',listed=[...new Set((result.athleteIds||[]).map(String))],teamKey=meetRecapTeamKey(result);
      let athleteIds=listed;
      if(!athleteIds.length)athleteIds=Object.entries(roster).filter(([id,record])=>{
        if(!record?.attending||!meetEventValues(record).includes(event)||(record.alternateEvents||[]).includes(event))return false;
        const athlete=meetAthlete(id);if(!athlete)return false;
        if(teamKey&&meetGenderKey(athlete)!==teamKey)return false;
        const assigned=String(record.relayTeams?.[event]||'').trim().toLowerCase(),relayTeam=String(result.relayTeam||'').trim().toLowerCase();
        return !assigned||!relayTeam||assigned===relayTeam
      }).map(([id])=>id);
      athleteIds.forEach(athleteId=>{
        const athlete=meetAthlete(athleteId);if(!athlete)return;
        const team=meetGenderKey(athlete)||teamKey||'boys',grade=String(athlete.grade||'');
        if(state.performanceTeam!=='all'&&state.performanceTeam!==team)return;
        if(state.performanceGrade!=='all'&&state.performanceGrade!==grade)return;
        rows.push({athleteId,athleteName:athlete.name||'Athlete',team,grade,event,mark:String(result.mark||''),place:String(result.place||''),round:meetResultRoundLabel(result.round)||'Official',relayTeam:String(result.relayTeam||''),meetId:meet.id,meetName:meet.name||'Meet',date:meet.date||'',handTime:!!meet.handTime})
      })
    })
  });
  return rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.event.localeCompare(b.event)||String(a.relayTeam).localeCompare(String(b.relayTeam))||a.round.localeCompare(b.round))
}
function performanceAthleteRelayHistoryMarkup(athleteId){
  const splitRows=performanceRelaySplitRows().filter(row=>row.athleteId===athleteId),teamRows=performanceAthleteRelayTeamRows().filter(row=>row.athleteId===athleteId);
  if(!splitRows.length&&!teamRows.length)return null;
  const make=(tag,className,text)=>{const element=document.createElement(tag);if(className)element.className=className;if(text!=null)element.textContent=text;return element};
  const history=make('section','performance-athlete-relay-history'),eyebrow=make('p','eyebrow','RELAY PERFORMANCE');history.append(eyebrow);
  const appendHeading=(title,description)=>history.append(make('h4','performance-relay-section-title',title),make('p','',description));
  const groups=new Map;
  splitRows.forEach(row=>{const key=row.event+'|'+(row.legEvent||'');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)});
  if(splitRows.length){
    appendHeading('Relay splits','Split trends are grouped by relay event and leg distance where available.');
    [...groups.values()].sort((a,b)=>a[0].event.localeCompare(b[0].event)||(a[0].legEvent||'').localeCompare(b[0].legEvent||'')).forEach(group=>{
      const ordered=[...group].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.round||'').localeCompare(String(b.round||''))),latest=ordered[ordered.length-1],valid=ordered.filter(row=>Number.isFinite(performanceMarkValue(row.mark))),best=valid.reduce((current,row)=>!current||performanceMarkValue(row.mark)<performanceMarkValue(current.mark)?row:current,null),first=group[0],block=make('div','performance-event-block performance-relay-graph-block'),head=make('div','performance-event-head'),title=make('h4','',first.event+(first.legEvent?' · '+first.legEvent:'')),bestValue=make('span',''),latestValue=make('span','');
      bestValue.innerHTML='Best split<br><b>'+esc(best?.mark||'—')+(best?' sec':'')+'</b>';latestValue.innerHTML='Latest split<br><b>'+esc(latest?.mark||'—')+(latest?' sec':'')+'</b>';head.append(title,bestValue,latestValue);
      if(valid.length){
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','performance-spark');svg.setAttribute('viewBox','0 0 260 60');svg.setAttribute('role','img');svg.setAttribute('aria-label',first.event+' relay split trend');
        const values=valid.map(row=>performanceMarkValue(row.mark)),min=Math.min(...values),max=Math.max(...values),range=max-min||1,points=values.map((value,index)=>({x:valid.length===1?130:5+index*(250/(valid.length-1)),y:54-(value-min)/range*44}));
        const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',points.map(point=>point.x.toFixed(1)+','+point.y.toFixed(1)).join(' '));svg.append(line);
        points.forEach(point=>{const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',point.x.toFixed(1));circle.setAttribute('cy',point.y.toFixed(1));circle.setAttribute('r','4');svg.append(circle)});head.append(svg)
      }else head.append(make('span','','No numeric splits yet'));
      block.append(head);
      [...group].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.round||'').localeCompare(String(a.round||''))).forEach(row=>{
        const line=make('div','performance-result-row performance-relay-history-row'),date=make('span','',performanceDate(row)),meet=make('span'),strong=make('strong','',row.meetName),small=make('small','',((row.round&&row.round!=='Official')?meetResultRoundLabel(row.round):'Relay split')+(row.leg?' · Leg '+row.leg:'')),mark=make('span','mark',row.mark+' sec'),detail=make('span','',(row.team==='girls'?'Girls':'Boys')+(row.legEvent?' · '+row.legEvent:'')),blank=make('span','');
        meet.append(strong,document.createElement('br'),small);line.append(date,meet,mark,detail,blank);block.append(line)
      });
      history.append(block)
    })
  }
  if(teamRows.length){
    appendHeading('Relay team times','Overall results from relay teams this athlete ran with.');
    const teams=new Map;teamRows.forEach(row=>{const key=row.event+'|'+row.relayTeam;if(!teams.has(key))teams.set(key,[]);teams.get(key).push(row)});
    [...teams.values()].sort((a,b)=>a[0].event.localeCompare(b[0].event)||a[0].relayTeam.localeCompare(b[0].relayTeam)).forEach(group=>{
      const first=group[0],block=make('div','performance-event-block performance-relay-team-block'),heading=make('div','performance-relay-team-heading'),title=make('h4','',first.event+(first.relayTeam?' · Team '+first.relayTeam:'')),count=make('span','',group.length+' result'+(group.length===1?'':'s'));heading.append(title,count);block.append(heading);
      [...group].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.round||'').localeCompare(String(a.round||''))).forEach(row=>{
        const line=make('div','performance-result-row performance-relay-team-row'),date=make('span','',performanceDate(row)),meet=make('span'),strong=make('strong','',row.event),small=make('small','',((row.round&&row.round!=='Official')?meetResultRoundLabel(row.round):'Relay team result')+(row.relayTeam?' · Team '+row.relayTeam:'')),mark=make('span','mark',row.mark||'—'),place=make('span','',row.place?'Place '+row.place:'—'),team=make('span','',row.team==='girls'?'Girls':'Boys');
        meet.append(strong,document.createElement('br'),small);line.append(date,meet,mark,place,team);block.append(line)
      });
      history.append(block)
    })
  }
  return history
}

const renderBeforeAthleteRelayPerformance=render;
render=function(){
  renderBeforeAthleteRelayPerformance();
  if(state.role!=='coach'||state.coachPage!=='performance'||state.performanceTab!=='athletes')return;
  const picker=document.querySelector('[data-action="performance-athlete"]'),selectedId=picker?.value||state.performanceAthleteId,card=[...document.querySelectorAll('.performance-card')].find(item=>item.querySelector('.performance-profile'));
  if(!selectedId||!card)return;
  card.querySelector('.performance-athlete-relay-splits')?.remove();card.querySelector('.performance-athlete-relay-history')?.remove();
  const relayHistory=performanceAthleteRelayHistoryMarkup(selectedId);if(relayHistory)card.append(relayHistory);
  const empty=[...card.querySelectorAll('.performance-empty')].find(item=>item.textContent.includes('No individual results'));
  if(empty&&(performanceRelaySplitRows().some(row=>row.athleteId===selectedId)||performanceAthleteRelayTeamRows().some(row=>row.athleteId===selectedId)))empty.remove()
};
